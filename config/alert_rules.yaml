alerts:
  - name: high_latency_p95
    severity: critical
    condition: 'latency_p95 > 3000ms'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: LLM Platform On-Call
    runbook: docs/alerts.md#alert-1

  - name: high_error_rate
    severity: critical
    condition: 'error_rate_pct > 2%'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: LLM Platform On-Call
    runbook: docs/alerts.md#alert-2

  - name: low_quality_or_retrieval_degradation
    severity: warning
    condition: 'quality_score_avg < 0.75 OR retrieval_success_rate_pct < 90%'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: LLM Platform On-Call
    runbook: docs/alerts.md#alert-3
